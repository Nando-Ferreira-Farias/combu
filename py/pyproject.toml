[project]
name = "combu"
version = "0.1.0"
description = "Python client for combu-db, a temporal, multi-source entity database on PostgreSQL"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
]

[project.scripts]
combu = "combu.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
