[project]
name = "combu"
version = "0.1.0"
description = "Python client for combu, a temporal, multi-source entity registry for PostgreSQL"
readme = "README.md"
license = "PostgreSQL"
requires-python = ">=3.14"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "sqlalchemy>=2.1.4",
]

[project.urls]
Homepage = "https://nando-ferreira-farias.github.io/combu/"
Source = "https://github.com/Nando-Ferreira-Farias/combu"

[project.scripts]
combu = "combu.__main__:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "RUF", "PTH"]

[tool.mypy]
python_version = "3.14"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
markers = ["integration: needs a PostgreSQL server (DATABASE_URL) with the combu files"]
